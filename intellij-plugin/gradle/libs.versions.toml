[versions]
# IntelliJ Platform Gradle Plugin 2.x — keep in lockstep with settings plugin id below.
intellijPlatform = "2.16.0"
kotlin = "2.1.20"
junit = "4.13.2"
# Compile/run against IDEA 2025.2; untilBuild covers through 2026.1 inclusive.
platformVersion = "2025.2.6.2"
sinceBuild = "252"
untilBuild = "261.*"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Applied without version in build.gradle.kts — settings already loads platform.settings 2.x.
intellij-platform = { id = "org.jetbrains.intellij.platform" }
intellij-platform-settings = { id = "org.jetbrains.intellij.platform.settings", version.ref = "intellijPlatform" }
