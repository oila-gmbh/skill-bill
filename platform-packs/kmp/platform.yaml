platform: kmp
contract_version: "1.5"
display_name: "Android & Kotlin Multiplatform"

routing_signals:
  strong:
    - ".kt"
    - "*.kt"
    - ".kts"
    - "*.kts"
    - 'kotlin("multiplatform")'
    - "org.jetbrains.kotlin.multiplatform"
    - "androidMain"
    - "iosMain"
    - "commonMain"
    - "AndroidManifest.xml"
    - "expect"
    - "actual"
  tie_breakers:
    - "If KMP or Android markers dominate, prefer this pack over generic Kotlin."
    - "Do not prefer this pack when an adjacent backend Kotlin/JVM service surface (Spring, Exposed, Hibernate, server Ktor) dominates the changed product surface and Android modules are incidental."
    - "Exclude generated and vendored files when deciding routing dominance."
  path: [".kt", "*.kt", ".kts", "*.kts", "AndroidManifest.xml", "androidMain", "iosMain", "commonMain"]
  # Android markers stay content-only: routing_signals.path must not gain src/main, which scores as a
  # unique 10-point path signal on every backend Kotlin file and would break backend-dominant routing.
  content:
    - 'kotlin("multiplatform")'
    - "org.jetbrains.kotlin.multiplatform"
    - "expect"
    - "actual"
    - "androidx.compose"
    - "androidx.navigation"
    - "androidx.lifecycle"
    - "androidx.room"
    - "androidx.datastore"
    - "@Composable"
    - "dagger.hilt"

declared_code_review_areas:
  - architecture
  - platform-correctness
  - persistence
  - reliability
  - ui
  - ux-accessibility

declared_files:
  baseline: code-review/bill-kmp-code-review/content.md
  areas:
    architecture: code-review/bill-kmp-code-review-architecture/content.md
    platform-correctness: code-review/bill-kmp-code-review-platform-correctness/content.md
    persistence: code-review/bill-kmp-code-review-persistence/content.md
    reliability: code-review/bill-kmp-code-review-reliability/content.md
    ui: code-review/bill-kmp-code-review-ui/content.md
    ux-accessibility: code-review/bill-kmp-code-review-ux-accessibility/content.md

declared_quality_check_file: quality-check/bill-kmp-code-check/content.md

validation_gate:
  full_gate_command:
    - ./gradlew
    - check
  cache_bypassing_full_gate_command:
    - ./gradlew
    - check
    - --rerun-tasks
    - --no-build-cache
  collect_all_full_gate_command:
    - ./gradlew
    - check
    - --continue
  cache_bypassing_collect_all_full_gate_command:
    - ./gradlew
    - check
    - --continue
    - --rerun-tasks
    - --no-build-cache
  build_only_command:
    - ./gradlew
    - classes
    - testClasses
  findings:
    format: junit_xml
    artifact_globs:
      - "runtime-kotlin/**/build/test-results/**/*.xml"
    compiler_diagnostics:
      format: gradle_kotlin_compiler_stdout
    executed_work:
      format: gradle_actionable_summary
  suppression_markers:
    - "@Suppress"
    - "@file:Suppress"

area_metadata:
  architecture:
    focus: "Gradle module boundaries and dependency direction, Hilt or Koin scope ownership, ViewModel lifecycle ownership, repository, use-case, and sync-engine authority, WorkManager ownership, and offline single-source-of-truth"
  platform-correctness:
    focus: "KMP expect/actual, source-set, target-runtime, and native-boundary correctness"
  persistence:
    focus: "Room, SQLDelight, and DataStore write atomicity, migration safety, and offline-first cursor correctness"
  reliability:
    focus: "WorkManager and CoroutineWorker retry, process-death recovery, and collector supervision"
  ui:
    focus: "KMP Compose UI correctness and framework usage"
  ux-accessibility:
    focus: "KMP user experience, Compose semantics, and accessibility"

lane_conditions:
  architecture:
    required: true
  platform-correctness:
    required: true
  persistence:
    content: ["room", "sqldelight", "datastore", "migration", "dao"]
  reliability:
    content: ["workmanager", "coroutineworker", "foregroundservice", "backoffpolicy", "retry"]
  ui:
    path: ["androidMain", "iosMain", "/src/main/"]
    content: ["compose", "@Composable", "navigation"]
  ux-accessibility:
    content: ["semantics", "contentDescription", "accessibility", "focusRequester"]

code_review_composition:
  baseline_layers:
    - platform: kotlin
      skill: bill-kotlin-code-review
      scope: same-review-scope
      required: true
      mode: kmp-baseline

addon_usage:
  code-review/bill-kmp-code-review:
    - slug: android-compose
      entrypoint: android-compose-review.md
      companion_pointers:
        - android-compose-edge-to-edge.md
        - android-compose-adaptive-layouts.md
        - android-navigation-review.md
        - android-design-system-review.md
        - android-interop-review.md
      specialist_areas: [ui]
      activation:
        any_content: ["compose", "@composable"]
        exclude_path: ["/commonMain/"]
    - slug: android-navigation
      entrypoint: android-navigation-review.md
      specialist_areas: [ui]
      activation:
        any_content: ["navcontroller", "navhost", "navigation"]
        exclude_path: ["/commonMain/"]
    - slug: android-interop
      entrypoint: android-interop-review.md
      specialist_areas: [ui]
      activation:
        any_content: ["androidview", "composeview", "interop"]
        exclude_path: ["/commonMain/"]
    - slug: android-design-system
      entrypoint: android-design-system-review.md
      specialist_areas: [ui]
      activation:
        any_content: ["materialtheme", "design system", "colorscheme"]
        exclude_path: ["/commonMain/"]
    - slug: android-r8
      entrypoint: android-r8-review.md
      activation:
        any_path: ["proguard-rules.pro", "consumer-rules.pro"]
        any_content: ["-keep", "minifyenabled", "shrinkresources"]
        exclude_path: ["/commonMain/"]
      specialist_areas: [platform-correctness]
  code-review/bill-kmp-code-review-ui:
    - slug: android-compose
      entrypoint: android-compose-review.md
      companion_pointers:
        - android-compose-edge-to-edge.md
        - android-compose-adaptive-layouts.md
        - android-navigation-review.md
        - android-design-system-review.md
        - android-interop-review.md
      activation:
        any_content: ["compose", "@composable"]
        exclude_path: ["/commonMain/"]
    - slug: android-navigation
      entrypoint: android-navigation-review.md
      activation:
        any_content: ["navcontroller", "navhost", "navigation"]
        exclude_path: ["/commonMain/"]
    - slug: android-interop
      entrypoint: android-interop-review.md
      activation:
        any_content: ["androidview", "composeview", "interop"]
        exclude_path: ["/commonMain/"]
    - slug: android-design-system
      entrypoint: android-design-system-review.md
      activation:
        any_content: ["materialtheme", "design system", "colorscheme"]
        exclude_path: ["/commonMain/"]
  quality-check/bill-kmp-code-check:
    - slug: android-r8
      entrypoint: android-r8-review.md

feature_addon_usage:
  feature-task:
    - slug: android-compose-implementation
      entrypoint: android-compose-implementation.md
    - slug: android-navigation-implementation
      entrypoint: android-navigation-implementation.md
    - slug: android-interop-implementation
      entrypoint: android-interop-implementation.md
