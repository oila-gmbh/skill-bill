contract_version: "0.1"
agents:
  - name: bill-php-code-review-api-contracts
    description: "PHP api contracts specialist — PHP Symfony, Laravel, and PSR request validation, serialization, errors, webhooks, idempotency, and client compatibility."
    compose: governed-content
    tools: [Read, Grep, Glob, Bash]
  - name: bill-php-code-review-architecture
    description: "PHP architecture specialist — PHP Composer and PSR-4 boundaries, composition roots, container and worker lifetimes, transactions, generators, and fibers."
    compose: governed-content
    tools: [Read, Grep, Glob, Bash]
  - name: bill-php-code-review-performance
    description: "PHP performance specialist — PHP PDO and ORM query cost, serializers and templates, streaming, OPcache, autoload state, worker memory, and fiber blocking."
    compose: governed-content
    tools: [Read, Grep, Glob, Bash]
  - name: bill-php-code-review-persistence
    description: "PHP persistence specialist — PHP PDO, Doctrine, and Eloquent transactions, locking, unit-of-work lifetime, tenant scope, migrations, and streaming."
    compose: governed-content
    tools: [Read, Grep, Glob, Bash]
  - name: bill-php-code-review-platform-correctness
    description: "PHP platform correctness specialist — PHP coercion, truthiness, errors, references, generators, request-versus-worker lifetime, autoloading, and fiber correctness."
    compose: governed-content
    tools: [Read, Grep, Glob, Bash]
  - name: bill-php-code-review-reliability
    description: "PHP reliability specialist — PHP Laravel and Messenger queues, acknowledgement, retry, worker reset, signals, timeouts, caches, locks, and fatal telemetry."
    compose: governed-content
    tools: [Read, Grep, Glob, Bash]
  - name: bill-php-code-review-security
    description: "PHP security specialist — PHP authorization, CSRF, deserialization, Blade and Twig escaping, uploads, paths, processes, SSRF, proxies, and secrets."
    compose: governed-content
    tools: [Read, Grep, Glob, Bash]
  - name: bill-php-code-review-testing
    description: "PHP testing specialist — PHPUnit and Pest isolation, framework kernels, database and worker regressions, PHPStan and Psalm, and runtime matrices."
    compose: governed-content
    tools: [Read, Grep, Glob, Bash]
  - name: bill-php-code-review-ui
    description: "PHP ui specialist — PHP Blade, Twig, Livewire, Inertia, Filament, and Symfony Form state, escaping, identity, and hydration correctness."
    compose: governed-content
    tools: [Read, Grep, Glob, Bash]
  - name: bill-php-code-review-ux-accessibility
    description: "PHP ux accessibility specialist — PHP-rendered labels, errors, keyboard and focus behavior, landmarks, live updates, localization, and progressive enhancement."
    compose: governed-content
    tools: [Read, Grep, Glob, Bash]
