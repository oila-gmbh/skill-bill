# Feature-task-runtime per-phase output schema (canonical source of truth).
#
# This file describes the structured output every phase of the experimental
# `feature-task-runtime` pipeline must emit before the runtime advances to the
# next phase. It is authored in YAML for human readability and consumed as a
# JSON Schema (Draft 2020-12) by the Kotlin runtime
# (`FeatureTaskRuntimePhaseOutputSchemaValidator` in `runtime-infra-fs`).
#
# Why this exists:
#
# - The runtime raises the per-phase progression gate from PRESENCE to
#   VALIDITY: a phase cannot complete or advance unless its output validates
#   against this schema. Empty (`{}`), malformed, or partially-filled output
#   blocks the run loudly with the offending phase id.
#
# What lives here vs. in Kotlin:
#
# - This file defines the REQUIRED-VS-OPTIONAL fields and VALUE-LEVEL
#   constraints of a single phase's output envelope — anything expressible in
#   pure JSON Schema (non-empty strings, enums, the pinned contract version).
# - The phase DAG, the three handoff layers, and latest-iteration selection
#   are pure-domain concerns and live in
#   `skillbill.workflow.taskruntime` (`runtime-domain`), not here.
#
# Versioning rule:
#
# - `contract_version` is pinned by `FEATURE_TASK_RUNTIME_CONTRACT_VERSION`
#   in
#   `runtime-kotlin/runtime-contracts/src/main/kotlin/skillbill/contracts/workflow/FeatureTaskRuntimeSchemaPaths.kt`.
# - The parity test `FeatureTaskRuntimePhaseOutputSchemaContractVersionTest`
#   fails the build if they diverge. To bump the contract, edit BOTH
#   constants in the same change.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/feature-task-runtime-phase-output-schema.yaml"
title: "Feature-task-runtime phase output"
description: >
  Schema for the structured output a single feature-task-runtime phase emits
  at its completion seam. The runtime validates this output before recording
  the phase as complete and assembling the next phase's handoff. Run-invariant,
  upstream-output, and derived-context handoff layers are modeled in the
  domain; this schema governs only the per-phase output artifact itself.
type: object
additionalProperties: false
$defs:
  phaseStatus:
    type: string
    enum:
      - completed
      - blocked
      - failed
  failureDisposition:
    type: string
    enum:
      - retryable
      - non_retryable_policy_conflict
      - needs_user_action
      - process_failure
      - invalid_output
  repairConstruct:
    type: object
    additionalProperties: false
    required: [symbol]
    properties:
      symbol:
        description: >-
          Compact symbol reference: Type or Type.member. Identifier characters
          only — no spaces, no Kotlin backtick or JUnit display names. Never a
          repository path.
        type: string
        minLength: 1
        maxLength: 256
        pattern: "^[A-Za-z_][A-Za-z0-9_$-]*(?:\\.[A-Za-z_][A-Za-z0-9_$-]*)?$"
      file:
        description: "Optional file basename used only when the compact symbol is ambiguous."
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9_.-]+$"
  repairReceiptEntry:
    type: object
    additionalProperties: false
    description: >-
      One carried finding's repair outcome. Identity is finding_id (canonical). Parsing accepts
      finding_ref, id, and ref as aliases; label and text are optional decoration and never gate
      coverage.
    required: [severity, outcome, constructs, intent]
    properties:
      severity:
        type: string
        enum: [blocker, major, minor, nit]
      label:
        type: string
        minLength: 1
        maxLength: 256
      text:
        type: string
        minLength: 1
        maxLength: 256
      finding_id:
        type: string
        minLength: 1
        maxLength: 256
      finding_ref:
        description: "Historical alias for finding_id; canonicalized at parse."
        type: string
        minLength: 1
        maxLength: 256
      id:
        description: "Historical alias for finding_id; canonicalized at parse."
        type: string
        minLength: 1
        maxLength: 256
      ref:
        description: "Historical alias for finding_id; canonicalized at parse."
        type: string
        minLength: 1
        maxLength: 256
      outcome:
        description: >-
          addressed: the round edited the named constructs and closed the finding. no_edit_required:
          the finding needs no change, with the reason. attempted_unresolved: the round tried and the
          finding is still open, with the reason and the constructs it touched. Additive and does not
          bump contract_version; a producer written before it existed still validates. Omitting a
          carried finding is never an outcome: the round is sent back for the omitted findings. A
          finding reported attempted_unresolved gets one more fix attempt; reported unresolved twice,
          it blocks for an operator carrying the reason instead of being lost silently.
        type: string
        enum: [addressed, no_edit_required, attempted_unresolved]
      constructs:
        type: array
        maxItems: 16
        items: { $ref: "#/$defs/repairConstruct" }
      intent:
        type: string
        minLength: 1
        maxLength: 356
        pattern: "^[^\\n\\r`]*\\S[^\\n\\r`]*$"
      no_edit_reason:
        type: string
        minLength: 1
        maxLength: 356
        pattern: "^[^\\n\\r`]*\\S[^\\n\\r`]*$"
      unresolved_reason:
        description: >-
          Why the attempt did not close the finding, on an attempted_unresolved entry. Read by an
          operator, so it names what was tried and what still fails.
        type: string
        minLength: 1
        maxLength: 356
        pattern: "^[^\\n\\r`]*\\S[^\\n\\r`]*$"
    allOf:
      - anyOf:
          - required: [finding_id]
          - required: [finding_ref]
          - required: [id]
          - required: [ref]
      - if:
          properties:
            outcome: { const: addressed }
          required: [outcome]
        then:
          properties:
            constructs: { minItems: 1 }
          allOf:
            - not: { required: [no_edit_reason] }
            - not: { required: [unresolved_reason] }
      - if:
          properties:
            outcome: { const: no_edit_required }
          required: [outcome]
        then:
          required: [no_edit_reason]
          not: { required: [unresolved_reason] }
      - if:
          properties:
            outcome: { const: attempted_unresolved }
          required: [outcome]
        then:
          required: [unresolved_reason]
          properties:
            constructs: { minItems: 1 }
          not: { required: [no_edit_reason] }
  verificationBoundaryHeadingProvenance:
    type: object
    additionalProperties: false
    required: [heading_id, source_path]
    properties:
      heading_id:
        type: string
        minLength: 1
        maxLength: 256
        pattern: "^[^\\n\\r`]*\\S[^\\n\\r`]*$"
      source_path:
        type: string
        minLength: 1
        maxLength: 256
        pattern: "^[^\\n\\r`]*\\S[^\\n\\r`]*$"
  repairDisturbedRemedy:
    type: object
    additionalProperties: false
    description: >-
      Declares that this round rewrote a construct the repair ledger records as another finding's
      live remedy. finding_ref names that finding as the carried ledger states it. Silent removal
      is a contract violation the runtime rejects, so the declaration is not optional for a round
      that did disturb settled work.
    required: [finding_ref, reason]
    properties:
      finding_ref:
        type: string
        minLength: 1
        maxLength: 256
      reason:
        description: "One line on why the settled construct had to change. Never a diff hunk or source body."
        type: string
        minLength: 1
        maxLength: 356
        pattern: "^[^\\n\\r`]*\\S[^\\n\\r`]*$"
  repairReceipt:
    type: object
    additionalProperties: false
    required: [contract_version, entries]
    properties:
      contract_version:
        type: string
        const: "0.2"
      round_number:
        description: >-
          Runtime-authored. Accepted when a producer still emits it and then overwritten with the
          durable remediation round, which no briefing carries. Carries no value constraint: the
          echo is discarded before the domain model is built, so validating it would fail a round
          over a value nothing reads.
        type: integer
      pre_fix_checkpoint_sha:
        description: >-
          Runtime-authored. Accepted when a producer still emits it and then overwritten with the
          durable remediation base sha. The most visible hash in the briefing is the
          repository-checkpoint fingerprint, a content hash that satisfies a git-sha shape without
          being a git commit, so a producer echo is never load-bearing and carries no value
          constraint here.
        type: string
      entries:
        type: array
        maxItems: 50
        items: { $ref: "#/$defs/repairReceiptEntry" }
  repairPlanEntry:
    type: object
    additionalProperties: false
    description: >-
      One carried finding's root cause, the minimal change that addresses it, and whether the
      finding is a local patch site or a symptom of a design defect an earlier remediation round
      introduced. prior_round_remedy_ref names that earlier finding and is admissible only on a
      design_symptom entry.
    required: [finding_ref, root_cause, minimal_change, classification]
    properties:
      finding_ref:
        type: string
        minLength: 1
        maxLength: 256
      root_cause:
        type: string
        minLength: 1
        maxLength: 512
        pattern: "^[^\\n\\r`]*\\S[^\\n\\r`]*$"
      minimal_change:
        type: string
        minLength: 1
        maxLength: 512
        pattern: "^[^\\n\\r`]*\\S[^\\n\\r`]*$"
      classification:
        type: string
        enum: [local_patch_site, design_symptom]
      prior_round_remedy_ref:
        type: string
        minLength: 1
        maxLength: 256
    allOf:
      - if:
          properties:
            classification: { const: local_patch_site }
          required: [classification]
        then:
          not: { required: [prior_round_remedy_ref] }
  repairPlan:
    type: object
    additionalProperties: false
    required: [contract_version, round_number, entries]
    properties:
      contract_version:
        type: string
        const: "0.1"
      round_number:
        type: integer
        minimum: 1
      entries:
        type: array
        minItems: 1
        maxItems: 50
        items: { $ref: "#/$defs/repairPlanEntry" }
  phaseProseProducedOutputs:
    type: object
    required: [value]
    properties:
      value:
        type: string
        minLength: 1
        pattern: ".*\\S.*"
      prompt:
        type: string
        minLength: 1
        pattern: ".*\\S.*"
required:
  - contract_version
  - phase_id
  - status
  - summary
  - produced_outputs
properties:
  contract_version:
    type: string
    const: "0.5"
  phase_id:
    type: string
    minLength: 1
  status:
    $ref: "#/$defs/phaseStatus"
  failure_disposition:
    description: >
      Typed failure behavior for blocked or failed phase output. Agents should
      omit it for completed output. The runtime treats policy conflicts and
      user-action requirements as durable non-retryable blocks; retryable,
      process-failure, and invalid-output dispositions may be relaunched under
      the applicable bounded retry policy. Optional for compatibility with
      existing durable 0.1 outputs; absent blocked output defaults to
      needs_user_action and absent failed output defaults to retryable.
    $ref: "#/$defs/failureDisposition"
  summary:
    type: string
    minLength: 1
  produced_outputs:
    type: object
    description: >
      Phase-specific structured payload forwarded to downstream phases as a
      declared upstream output. Value shapes are phase-specific by contract
      (strings, arrays, nested objects all occur), so they are left open; the
      envelope guarantees the field is present, carries at least one entry
      (an empty `{}` blocks the run), and uses only non-empty string keys.
      Mutating phases (e.g. `implement`) MUST additionally carry a
      reconciliation report as an entry *inside this `produced_outputs`
      object* — a `reconciled_state` object (or a `reconciled` entry) with
      `reconciled` set to true plus evidence that the changed files are at
      their intended target state — so the runtime can verify (not assume)
      the mutating-phase idempotency contract: the phase reconciled the
      working tree to target rather than re-applying or silently skipping.
      The report is a member of `produced_outputs`, never a sibling of it:
      the output envelope is closed (`additionalProperties: false`), so a
      root-level `reconciled_state` is rejected as an unknown property and
      does not satisfy this requirement. The runtime enforces this per-phase
      reconciliation check at the gate; it is documented here for authors.
      This is a description-only clarification and adds no JSON-Schema
      constraint.
    minProperties: 1
    propertyNames:
      type: string
      minLength: 1
  derived_notes:
    description: >
      Optional free-text note. Either absent (not set) or a non-empty string;
      `null` is not a valid value.
    type: string
    minLength: 1
  verdict:
    description: >
      Optional structured verdict emitted by a verifying phase (e.g. `review`)
      that the runtime reads to decide whether to advance or take a remediation
      backward edge. For `review` the values are `approved` (no unresolved
      advance-blocking findings) or `changes_requested` (one or more unresolved
      Blocker or Major findings present); Blocker and Major both block advancing
      and both reopen the remediation span, while Minor and Nit stay advisory. The
      runtime classifies the verdict from the carried review
      findings, which travel inside `produced_outputs` (e.g. a `findings` array
      of severity/message entries) and are forwarded into the `implement_fix`
      handoff.       For `audit` the values are `satisfied` (every acceptance criterion
      met) or `gaps_found` (one or more acceptance criteria remain unmet). The
      runtime reads only this envelope verdict to decide advance versus the
      `audit_gap` backward edge; gap detail lives inside
      `produced_outputs.value` as structured prose and is not cross-checked
      against the verdict. Either absent (not set) or a non-empty string;
      `null` is not a valid value. The field itself is additive and optional
      for non-audit phases — existing phase outputs that omit it still validate
      — but the `audit` phase constraints in `allOf` require a verdict in
      `{satisfied, gaps_found}`. Contract version `0.5` pins the prose-centric
      audit produced_outputs shape; workflows created under an earlier version
      require a hard reset.
    type: string
    minLength: 1
allOf:
  - if:
      properties:
        phase_id: { const: audit }
      required: [phase_id]
    then:
      required: [verdict]
      properties:
        verdict: { enum: [satisfied, gaps_found] }
  - if:
      properties:
        phase_id: { const: audit }
        status: { const: completed }
      required: [phase_id, status]
    then:
      properties:
        produced_outputs:
          allOf:
            - { $ref: "#/$defs/phaseProseProducedOutputs" }
  - if:
      properties:
        phase_id: { const: verify_findings }
      required: [phase_id]
    then:
      required: [verdict]
      properties:
        verdict: { enum: [findings_verified, no_findings_verified] }
        produced_outputs:
          type: object
          required: [finding_dispositions]
          properties:
            finding_dispositions:
              type: array
              maxItems: 100
              items:
                allOf:
                  - type: object
                    additionalProperties: false
                    required: [finding_id, disposition, reason, severity, location, message]
                    properties:
                      finding_id: { type: string, minLength: 1, pattern: ".*\\S.*" }
                      disposition: { enum: [verified, rejected] }
                      reason: { type: string, minLength: 1, maxLength: 280 }
                      severity: { enum: [blocker, major, minor, nit] }
                      location: { type: string, minLength: 1, maxLength: 180 }
                      message: { type: string, minLength: 1, maxLength: 280 }
                      boundary_context_unavailable: { type: boolean }
                      selected_boundary_headings:
                        type: array
                        maxItems: 12
                        items: { $ref: "#/$defs/verificationBoundaryHeadingProvenance" }
                  - if:
                      properties:
                        boundary_context_unavailable: { const: true }
                      required: [boundary_context_unavailable]
                    then:
                      properties:
                        selected_boundary_headings:
                          maxItems: 0
  - if:
      properties:
        phase_id: { const: implement_fix }
        status: { const: completed }
      required: [phase_id, status]
    then:
      properties:
        produced_outputs:
          type: object
          required: [repair_receipt]
          properties:
            repair_receipt: { $ref: "#/$defs/repairReceipt" }
  - if:
      properties:
        phase_id: { const: preplan }
        status: { const: completed }
      required: [phase_id, status]
    then:
      properties:
        produced_outputs:
          allOf:
            - { $ref: "#/$defs/phaseProseProducedOutputs" }
  - if:
      properties:
        phase_id: { const: plan }
        status: { const: completed }
      required: [phase_id, status]
    then:
      properties:
        produced_outputs:
          allOf:
            - { $ref: "#/$defs/phaseProseProducedOutputs" }
  - if:
      properties:
        phase_id: { const: implement }
        status: { const: completed }
      required: [phase_id, status]
    then:
      properties:
        produced_outputs:
          allOf:
            - { $ref: "#/$defs/phaseProseProducedOutputs" }
