$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/feature-task-runtime-phase-handoff-schema.yaml"
title: Feature-task-runtime phase handoff declaration
description: Workflow-owned closed-world declaration of the bounded input delivered to one consumer.
type: object
additionalProperties: false
required:
  - contract_version
  - consumer_phase_id
  - projection_name
  - source
  - projection_contract
  - prompt_visibility
  - budget
  - checkpoint_policy
  - producer_iteration
  - declared_fields
  - required
  - allows_private_artifact_reference
properties:
  contract_version:
    const: "0.2"
  consumer_phase_id:
    type: string
    minLength: 1
  projection_name:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
  source:
    $ref: "#/$defs/source"
  projection_contract:
    $ref: "#/$defs/projection_contract"
  prompt_visibility:
    enum: [prompt_visible, private_evidence_only]
  budget:
    $ref: "#/$defs/budget"
  checkpoint_policy:
    enum: [not_required, must_match, refresh_from_repository]
  producer_iteration:
    $ref: "#/$defs/producer_iteration"
  declared_fields:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
  required:
    type: boolean
  allows_private_artifact_reference:
    type: boolean
  inline_alternative:
    enum:
      - private_evidence_artifact
      - repository_path
      - repository_checkpoint
      - acceptance_criterion_ref
      - repair_item_id
  authorized_reference_kinds:
    type: array
    uniqueItems: true
    items:
      enum:
        - private_evidence_artifact
        - repository_path
        - repository_checkpoint
        - acceptance_criterion_ref
        - repair_item_id
$defs:
  source:
    type: object
    additionalProperties: false
    required: [kind, id]
    properties:
      kind:
        enum:
          - upstream_phase_output
          - run_invariant_field
          - derived_ceremony_scaling
          - addon_content
          - shared_review_evidence
          - repair_ledger
          - prior_gap_memory
      id:
        type: string
        minLength: 1
  projection_contract:
    type: object
    additionalProperties: false
    required: [id, version]
    properties:
      id:
        type: string
        minLength: 1
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+$"
  budget:
    type: object
    additionalProperties: false
    required: [max_utf8_bytes, max_collection_items]
    properties:
      max_utf8_bytes:
        type: integer
        minimum: 1
      max_collection_items:
        type: integer
        minimum: 1
  producer_iteration:
    type: object
    additionalProperties: false
    required: [phase_id, iteration]
    properties:
      phase_id:
        type: string
        minLength: 1
      iteration:
        type: integer
        minimum: 1
x-coherence-checks:
  - id: workflow-owned-fields
    description: Sources, fields, and reference kinds originate only from typed workflow declarations.
  - id: pre-launch-budget
    description: Serialized UTF-8 bytes and collection items are checked before an agent launch.
  - id: incompatible-legacy-version
    description: Records from the implicit declaration contract loud-fail and require restart or migration.
