$schema: https://json-schema.org/draft/2020-12/schema
$id: https://skill-bill.dev/contracts/review-context-schema.yaml
title: Review context contract
description: Strict bounded immutable context exchanged by delegated review participants.
oneOf:
  - $ref: "#/$defs/parent_packet"
  - $ref: "#/$defs/assignment"
  - $ref: "#/$defs/launch"
  - $ref: "#/$defs/integration_launch"
  - $ref: "#/$defs/verification_launch"
  - $ref: "#/$defs/adjudication_launch"
  - $ref: "#/$defs/finding_verdict"
  - $ref: "#/$defs/budget_outcome"
  - $ref: "#/$defs/accounting_summary"
$defs:
  digest: { type: string, pattern: "^[a-f0-9]{64}$" }
  identifier: { type: string, minLength: 1, pattern: '.*\S.*' }
  path: { type: string, minLength: 1, pattern: '^(?!/)(?!.*\\)(?!.*(?:^|/)\.\.(?:/|$)).+$' }
  strings:
    type: array
    uniqueItems: true
    items: { type: string, minLength: 1, pattern: '.*\S.*' }
  hunk_id: { type: string, pattern: "^[a-f0-9]{64}$" }
  hunk_ids:
    type: array
    uniqueItems: true
    items: { $ref: "#/$defs/hunk_id" }
  review_revision:
    type: object
    additionalProperties: false
    required: [session_id, run_revision]
    properties:
      session_id: { $ref: "#/$defs/identifier" }
      run_revision: { type: integer, minimum: 1 }
  rule_reference:
    type: object
    additionalProperties: false
    required: [rule_id, source_path, excerpt, digest]
    properties:
      rule_id: { $ref: "#/$defs/identifier" }
      source_path: { $ref: "#/$defs/path" }
      excerpt: { type: string, minLength: 1, maxLength: 2000, pattern: '.*\S.*' }
      digest: { $ref: "#/$defs/digest" }
  rule_references:
    type: array
    items: { $ref: "#/$defs/rule_reference" }
  learnings_reference:
    type: object
    additionalProperties: false
    required: [learning_id, source, digest]
    properties:
      learning_id: { $ref: "#/$defs/identifier" }
      source: { $ref: "#/$defs/identifier" }
      digest: { $ref: "#/$defs/digest" }
  build_test_fact:
    type: object
    additionalProperties: false
    required: [kind, command, outcome]
    properties:
      kind: { $ref: "#/$defs/identifier" }
      command: { $ref: "#/$defs/identifier" }
      outcome: { $ref: "#/$defs/identifier" }
  dependency_allowlist:
    type: array
    uniqueItems: true
    items: { $ref: "#/$defs/path" }
  baseline_untracked_policy:
    type: object
    additionalProperties: false
    required: [included_paths, excluded_paths]
    properties:
      included_paths:
        type: array
        uniqueItems: true
        items: { $ref: "#/$defs/path" }
      excluded_paths:
        type: array
        uniqueItems: true
        items: { $ref: "#/$defs/path" }
  evidence_target:
    type: object
    additionalProperties: false
    required: [target_id, path, hunk_ids]
    properties:
      target_id: { $ref: "#/$defs/identifier" }
      path: { $ref: "#/$defs/path" }
      hunk_ids: { $ref: "#/$defs/hunk_ids" }
  evidence_targets:
    type: array
    items: { $ref: "#/$defs/evidence_target" }
  lane_decision:
    type: object
    additionalProperties: false
    required: [lane, included, reason, owned_paths, order_index, required_lane, origin_layer_chains, owning_pack, specialist_skill_name, add_ons]
    properties:
      lane: { $ref: "#/$defs/identifier" }
      included: { type: boolean }
      reason: { type: string, minLength: 1, pattern: '.*\S.*' }
      signals: { $ref: "#/$defs/strings" }
      owned_paths:
        type: array
        uniqueItems: true
        items: { $ref: "#/$defs/path" }
      order_index: { type: integer, minimum: 0 }
      required_lane: { type: boolean }
      origin_layer_chains:
        type: array
        uniqueItems: true
        items: { type: array, minItems: 1, items: { $ref: "#/$defs/identifier" } }
      owning_pack: { type: [string, "null"] }
      specialist_skill_name: { type: [string, "null"] }
      add_ons: { $ref: "#/$defs/strings" }
    allOf:
      - if:
          properties:
            included: { const: true }
          required: [included]
        then:
          required: [origin_layer_chains, owning_pack, specialist_skill_name]
          properties:
            origin_layer_chains: { minItems: 1 }
            owning_pack: { $ref: "#/$defs/identifier" }
            specialist_skill_name: { $ref: "#/$defs/identifier" }
  expansion_record:
    type: object
    additionalProperties: false
    required: [expansion_id, assignment_digest, requested_path, reachability_reason, authorized, sequence]
    properties:
      expansion_id: { $ref: "#/$defs/identifier" }
      assignment_digest: { $ref: "#/$defs/digest" }
      requested_path: { $ref: "#/$defs/path" }
      reachability_reason: { type: string, minLength: 1, pattern: '.*\S.*' }
      authorized: { type: boolean }
      sequence: { type: integer, minimum: 0 }
  expansion_records:
    type: array
    uniqueItems: true
    items: { $ref: "#/$defs/expansion_record" }
  evidence_locator:
    type: object
    additionalProperties: false
    required: [store_path, payload_file, hunk_header]
    properties:
      store_path: { $ref: "#/$defs/path" }
      payload_file: { const: "diff.patch" }
      hunk_header: { type: string, minLength: 1, pattern: '.*\S.*' }
  hunk:
    type: object
    additionalProperties: false
    required: [hunk_id, path, old_start, old_count, new_start, new_count, content_digest, evidence_locator]
    properties:
      hunk_id: { $ref: "#/$defs/hunk_id" }
      path: { $ref: "#/$defs/path" }
      old_start: { type: integer, minimum: 0 }
      old_count: { type: integer, minimum: 0 }
      new_start: { type: integer, minimum: 0 }
      new_count: { type: integer, minimum: 0 }
      content_digest: { $ref: "#/$defs/digest" }
      evidence_locator: { $ref: "#/$defs/evidence_locator" }
  commit_unit:
    type: object
    additionalProperties: false
    required: [commit_unit_id, commit_sha, parent_sha, subject, order_index, source, hunk_ids]
    properties:
      commit_unit_id: { $ref: "#/$defs/digest" }
      commit_sha: { $ref: "#/$defs/identifier" }
      parent_sha: { $ref: "#/$defs/identifier" }
      subject: { type: string }
      order_index: { type: integer, minimum: 0 }
      source: { enum: [commit_range, synthetic_working_tree, synthetic_supplied_diff, synthetic_aggregate_pr_diff] }
      hunk_ids: { $ref: "#/$defs/hunk_ids" }
  commit_sequence:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/commit_unit" }
  # Stable identity of the reviewed commit sequence: SHA-256 over the ordered commit_unit_ids. It
  # names which sequence a lane result or integration result belongs to, so aggregation can reject
  # a result minted against a different sequence instead of merging it.
  commit_sequence_digest: { $ref: "#/$defs/digest" }
  coverage_fact:
    type: object
    additionalProperties: false
    required: [base_revision, head_revision, commit_count, chain_verified, path_coverage_verified, degraded_reason]
    properties:
      base_revision: { $ref: "#/$defs/identifier" }
      head_revision: { $ref: "#/$defs/identifier" }
      commit_count: { type: integer, minimum: 1 }
      chain_verified: { type: boolean }
      path_coverage_verified: { type: boolean }
      degraded_reason: { type: [string, "null"] }
  commit_lane_decision:
    type: object
    additionalProperties: false
    required: [commit_sha, order_index, lane, disposition, reason, signals]
    properties:
      commit_sha: { $ref: "#/$defs/identifier" }
      order_index: { type: integer, minimum: 0 }
      lane: { $ref: "#/$defs/identifier" }
      disposition: { enum: [focused, skipped] }
      reason: { type: string, minLength: 1, maxLength: 600, pattern: '.*\S.*' }
      signals: { $ref: "#/$defs/strings" }
  lane_routing:
    type: array
    items: { $ref: "#/$defs/commit_lane_decision" }
  routing_matrix:
    type: object
    additionalProperties: false
    required: [routing_digest, commit_shas, lanes, decisions]
    properties:
      routing_digest: { $ref: "#/$defs/digest" }
      commit_shas: { $ref: "#/$defs/strings", minItems: 1 }
      lanes: { $ref: "#/$defs/strings", minItems: 1 }
      decisions:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/commit_lane_decision" }
  lane_bundle_entry:
    type: object
    additionalProperties: false
    required: [commit_sha, order_index, hunk_ids]
    properties:
      commit_sha: { $ref: "#/$defs/identifier" }
      order_index: { type: integer, minimum: 0 }
      hunk_ids: { $ref: "#/$defs/hunk_ids", minItems: 1 }
  lane_bundle:
    type: object
    additionalProperties: false
    required: [bundle_digest, entries]
    properties:
      bundle_digest: { $ref: "#/$defs/digest" }
      entries:
        type: array
        items: { $ref: "#/$defs/lane_bundle_entry" }
  assigned_commit_unit:
    type: object
    additionalProperties: false
    required: [commit_unit_id, commit_sha, parent_sha, subject, order_index, source]
    properties:
      commit_unit_id: { $ref: "#/$defs/digest" }
      commit_sha: { $ref: "#/$defs/identifier" }
      parent_sha: { $ref: "#/$defs/identifier" }
      subject: { type: string }
      order_index: { type: integer, minimum: 0 }
      source: { enum: [commit_range, synthetic_working_tree, synthetic_supplied_diff, synthetic_aggregate_pr_diff] }
  launch_bundle_segment_entry:
    type: object
    additionalProperties: false
    required: [commit_sha, order_index, hunk_id, path]
    properties:
      commit_sha: { $ref: "#/$defs/identifier" }
      order_index: { type: integer, minimum: 0 }
      hunk_id: { $ref: "#/$defs/hunk_id" }
      path: { $ref: "#/$defs/path" }
  launch_bundle_segment:
    type: object
    additionalProperties: false
    required: [segment_id, measured_bytes, composition_digest, entries]
    properties:
      segment_id: { $ref: "#/$defs/identifier" }
      measured_bytes: { type: integer, minimum: 0 }
      composition_digest: { $ref: "#/$defs/digest" }
      entries:
        type: array
        items: { $ref: "#/$defs/launch_bundle_segment_entry" }
  launch_bundle_entry:
    type: object
    additionalProperties: false
    required: [commit_sha, parent_sha, subject, order_index, hunk_id, path, old_start, old_count, new_start, new_count, content_digest, evidence_locator]
    properties:
      commit_sha: { $ref: "#/$defs/identifier" }
      parent_sha: { $ref: "#/$defs/identifier" }
      subject: { type: string }
      order_index: { type: integer, minimum: 0 }
      hunk_id: { $ref: "#/$defs/hunk_id" }
      path: { $ref: "#/$defs/path" }
      old_start: { type: integer, minimum: 0 }
      old_count: { type: integer, minimum: 0 }
      new_start: { type: integer, minimum: 0 }
      new_count: { type: integer, minimum: 0 }
      content_digest: { $ref: "#/$defs/digest" }
      evidence_locator: { $ref: "#/$defs/evidence_locator" }
  launch_bundle:
    type: object
    additionalProperties: false
    required: [composition_digest, lane_disposition, unreviewed_segment_ids, entries, segments]
    properties:
      composition_digest: { $ref: "#/$defs/digest" }
      lane_disposition: { enum: [complete, incomplete] }
      budget_dimension: { $ref: "#/$defs/identifier" }
      unreviewed_segment_ids:
        type: array
        items: { $ref: "#/$defs/identifier" }
      entries:
        type: array
        items: { $ref: "#/$defs/launch_bundle_entry" }
      segments:
        type: array
        items: { $ref: "#/$defs/launch_bundle_segment" }
    allOf:
      - if:
          properties:
            lane_disposition: { const: incomplete }
          required: [lane_disposition]
        then:
          required: [budget_dimension]
  parent_packet:
    type: object
    additionalProperties: false
    required: [contract_version, kind, review_id, packet_digest, review_revision, repository_identity, base_revision, head_revision, status, composed_layers, selected_lanes, lane_decisions, changed_hunks, commit_units, commit_sequence_digest, coverage_fact, routing_matrix, matched_rules, learnings_references, build_test_facts, dependency_allowlist, evidence_targets, expansion_ledger, baseline_untracked_policy]
    properties:
      contract_version: { const: "2.0" }
      kind: { const: parent_packet }
      review_id: { $ref: "#/$defs/identifier" }
      packet_digest: { $ref: "#/$defs/digest" }
      review_revision: { $ref: "#/$defs/review_revision" }
      repository_identity: { $ref: "#/$defs/identifier" }
      base_revision: { $ref: "#/$defs/identifier" }
      head_revision: { $ref: "#/$defs/identifier" }
      status: { type: string }
      stack: { type: [string, "null"] }
      pack: { type: [string, "null"] }
      add_ons: { $ref: "#/$defs/strings" }
      composed_layers: { $ref: "#/$defs/strings" }
      selected_lanes: { $ref: "#/$defs/strings", minItems: 1 }
      lane_decisions:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/lane_decision" }
      changed_hunks: { type: array, items: { $ref: "#/$defs/hunk" } }
      commit_units: { $ref: "#/$defs/commit_sequence" }
      commit_sequence_digest: { $ref: "#/$defs/commit_sequence_digest" }
      coverage_fact: { $ref: "#/$defs/coverage_fact" }
      routing_matrix: { $ref: "#/$defs/routing_matrix" }
      matched_rules: { $ref: "#/$defs/rule_references" }
      learnings_references:
        type: array
        items: { $ref: "#/$defs/learnings_reference" }
      build_test_facts:
        type: array
        items: { $ref: "#/$defs/build_test_fact" }
      dependency_allowlist: { $ref: "#/$defs/dependency_allowlist" }
      baseline_untracked_policy: { $ref: "#/$defs/baseline_untracked_policy" }
      evidence_targets: { $ref: "#/$defs/evidence_targets" }
      expansion_ledger: { $ref: "#/$defs/expansion_records" }
  assignment:
    type: object
    additionalProperties: false
    required: [contract_version, kind, review_id, packet_digest, assignment_digest, review_revision, lane, lane_decision, base_revision, head_revision, assigned_paths, assigned_hunks, assigned_bundle, lane_routing, criteria_references, matched_rules, evidence_targets, dependency_allowlist, expansions, baseline_untracked_policy]
    properties:
      contract_version: { const: "2.0" }
      kind: { const: assignment }
      review_id: { $ref: "#/$defs/identifier" }
      packet_digest: { $ref: "#/$defs/digest" }
      assignment_digest: { $ref: "#/$defs/digest" }
      review_revision: { $ref: "#/$defs/review_revision" }
      lane: { $ref: "#/$defs/identifier" }
      lane_decision: { $ref: "#/$defs/lane_decision" }
      base_revision: { $ref: "#/$defs/identifier" }
      head_revision: { $ref: "#/$defs/identifier" }
      assigned_paths: { type: array, uniqueItems: true, items: { $ref: "#/$defs/path" } }
      assigned_hunks: { $ref: "#/$defs/hunk_ids" }
      assigned_bundle: { $ref: "#/$defs/lane_bundle" }
      lane_routing: { $ref: "#/$defs/lane_routing" }
      criteria_references: { $ref: "#/$defs/strings" }
      matched_rules: { $ref: "#/$defs/rule_references" }
      evidence_targets: { $ref: "#/$defs/evidence_targets" }
      dependency_allowlist: { $ref: "#/$defs/dependency_allowlist" }
      expansions: { $ref: "#/$defs/expansion_records" }
      baseline_untracked_policy: { $ref: "#/$defs/baseline_untracked_policy" }
  launch:
    type: object
    additionalProperties: false
    required: [contract_version, kind, review_id, packet_digest, assignment_digest, review_revision, lane, base_revision, head_revision, specialist_contract, consumer_contract, rubric, assigned_paths, assigned_hunks, assigned_commit_units, lane_routing, coverage_fact, bundle, criteria_references, matched_rules, evidence_targets, dependency_allowlist, baseline_untracked_policy, forbidden_rediscovery, evidence_surface_rules, report_structure, broker_id, isolation, budget]
    properties:
      contract_version: { const: "2.0" }
      kind: { const: launch }
      review_id: { $ref: "#/$defs/identifier" }
      packet_digest: { $ref: "#/$defs/digest" }
      assignment_digest: { $ref: "#/$defs/digest" }
      review_revision: { $ref: "#/$defs/review_revision" }
      lane: { $ref: "#/$defs/identifier" }
      base_revision: { $ref: "#/$defs/identifier" }
      head_revision: { $ref: "#/$defs/identifier" }
      specialist_contract: { type: string, minLength: 1, pattern: '.*\S.*' }
      consumer_contract: { type: string, minLength: 1, pattern: '.*\S.*' }
      rubric: { type: string, minLength: 1, pattern: '.*\S.*' }
      assigned_paths: { type: array, uniqueItems: true, items: { $ref: "#/$defs/path" } }
      assigned_hunks: { $ref: "#/$defs/hunk_ids" }
      assigned_commit_units:
        type: array
        items: { $ref: "#/$defs/assigned_commit_unit" }
      lane_routing: { $ref: "#/$defs/lane_routing" }
      coverage_fact: { $ref: "#/$defs/coverage_fact" }
      bundle: { $ref: "#/$defs/launch_bundle" }
      criteria_references: { $ref: "#/$defs/strings" }
      matched_rules: { $ref: "#/$defs/rule_references" }
      evidence_targets: { $ref: "#/$defs/evidence_targets" }
      dependency_allowlist: { $ref: "#/$defs/dependency_allowlist" }
      baseline_untracked_policy: { $ref: "#/$defs/baseline_untracked_policy" }
      forbidden_rediscovery: { $ref: "#/$defs/strings", minItems: 1 }
      evidence_surface_rules: { type: string, minLength: 1, pattern: '.*\S.*' }
      report_structure: { type: string, minLength: 1, pattern: '.*\S.*' }
      broker_id: { $ref: "#/$defs/identifier" }
      isolation: { const: fresh }
      budget: { $ref: "#/$defs/budget" }
  # What one specialist lane reports upward to the integration pass: its identity, its coverage
  # disposition, and a bounded prose summary. Deliberately carries no hunk bodies, no rubric, and
  # no transcript, so a sibling lane's raw evidence cannot reach the integration worker through it.
  specialist_summary:
    type: object
    additionalProperties: false
    required: [lane, assignment_digest, lane_disposition, assigned_paths, commit_shas, finding_count, unreviewed_segment_ids, summary]
    properties:
      lane: { $ref: "#/$defs/identifier" }
      assignment_digest: { $ref: "#/$defs/digest" }
      lane_disposition: { enum: [complete, incomplete] }
      assigned_paths:
        type: array
        uniqueItems: true
        items: { $ref: "#/$defs/path" }
      commit_shas: { $ref: "#/$defs/strings" }
      finding_count: { type: integer, minimum: 0 }
      unreviewed_segment_ids:
        type: array
        items: { $ref: "#/$defs/identifier" }
      summary: { type: string, maxLength: 2000 }
  # The single bounded pass that runs once after every specialist lane reaches a terminal state.
  # It receives final-state evidence targets plus per-lane summaries — never a lane's raw bundle,
  # never a sibling lane's hunk bodies, and never a parent transcript. `additionalProperties: false`
  # is the enforcement seam: a payload carrying `bundle`, `assigned_hunks`, or
  # any transcript field is rejected rather than quietly delivered.
  integration_launch:
    type: object
    additionalProperties: false
    required: [contract_version, kind, review_id, packet_digest, review_revision, commit_sequence_digest, base_revision, head_revision, integration_contract, consumer_contract, commit_units, specialist_summaries, coverage_fact, final_state_evidence_targets, dependency_allowlist, forbidden_rediscovery, evidence_surface_rules, report_structure, broker_id, isolation, budget]
    properties:
      contract_version: { const: "2.0" }
      kind: { const: integration_launch }
      review_id: { $ref: "#/$defs/identifier" }
      packet_digest: { $ref: "#/$defs/digest" }
      review_revision: { $ref: "#/$defs/review_revision" }
      commit_sequence_digest: { $ref: "#/$defs/commit_sequence_digest" }
      base_revision: { $ref: "#/$defs/identifier" }
      head_revision: { $ref: "#/$defs/identifier" }
      integration_contract: { type: string, minLength: 1, pattern: '.*\S.*' }
      consumer_contract: { type: string, minLength: 1, pattern: '.*\S.*' }
      commit_units:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/assigned_commit_unit" }
      specialist_summaries:
        type: array
        items: { $ref: "#/$defs/specialist_summary" }
      coverage_fact: { $ref: "#/$defs/coverage_fact" }
      final_state_evidence_targets: { $ref: "#/$defs/evidence_targets" }
      dependency_allowlist: { $ref: "#/$defs/dependency_allowlist" }
      forbidden_rediscovery: { $ref: "#/$defs/strings", minItems: 1 }
      evidence_surface_rules: { type: string, minLength: 1, pattern: '.*\S.*' }
      report_structure: { type: string, minLength: 1, pattern: '.*\S.*' }
      broker_id: { $ref: "#/$defs/identifier" }
      isolation: { const: fresh }
      budget: { $ref: "#/$defs/budget" }
  spec_intent_provenance:
    type: object
    additionalProperties: false
    required: [spec_path, content_digest]
    properties:
      spec_path: { $ref: "#/$defs/path" }
      content_digest: { $ref: "#/$defs/digest" }
  spec_intent_projection:
    type: object
    additionalProperties: false
    required: [intended_outcome, acceptance_criteria, constraints, non_goals, deferred_items, provenance, declared_byte_budget]
    properties:
      intended_outcome: { type: string, minLength: 1, pattern: '.*\S.*' }
      acceptance_criteria: { $ref: "#/$defs/strings" }
      constraints: { $ref: "#/$defs/strings" }
      non_goals: { $ref: "#/$defs/strings" }
      deferred_items: { $ref: "#/$defs/strings" }
      provenance: { $ref: "#/$defs/spec_intent_provenance" }
      declared_byte_budget: { type: integer, minimum: 1 }
  review_finding:
    type: object
    additionalProperties: false
    required: [finding_ref, severity, location, description]
    properties:
      finding_ref: { $ref: "#/$defs/identifier" }
      severity: { $ref: "#/$defs/identifier" }
      location: { type: string, minLength: 1, pattern: '.*\S.*' }
      description: { type: string, minLength: 1, pattern: '.*\S.*' }
      confidence: { type: string, minLength: 1, pattern: '.*\S.*' }
  cited_region:
    type: object
    additionalProperties: false
    required: [path, start_line, end_line]
    properties:
      path: { $ref: "#/$defs/path" }
      start_line: { type: integer, minimum: 1 }
      end_line: { type: integer, minimum: 1 }
  delta_reference:
    type: object
    additionalProperties: false
    required: [base_revision, head_revision]
    properties:
      base_revision: { $ref: "#/$defs/identifier" }
      head_revision: { $ref: "#/$defs/identifier" }
  finding_citation:
    type: object
    additionalProperties: false
    required: [path, line]
    properties:
      path: { $ref: "#/$defs/path" }
      line: { type: integer, minimum: 1 }
  severity_adjustment:
    type: object
    additionalProperties: false
    required: [direction, justification]
    properties:
      direction: { enum: [raise, lower] }
      justification: { type: string, minLength: 1, pattern: '.*\S.*' }
  verification_launch:
    type: object
    additionalProperties: false
    required: [contract_version, kind, review_id, packet_digest, review_revision, finding, cited_region, delta_reference, evidence_surface_rules, dependency_allowlist, forbidden_rediscovery, broker_id, isolation, budget]
    properties:
      contract_version: { const: "2.0" }
      kind: { const: verification_launch }
      review_id: { $ref: "#/$defs/identifier" }
      packet_digest: { $ref: "#/$defs/digest" }
      review_revision: { $ref: "#/$defs/review_revision" }
      finding: { $ref: "#/$defs/review_finding" }
      cited_region: { $ref: "#/$defs/cited_region" }
      delta_reference: { $ref: "#/$defs/delta_reference" }
      evidence_surface_rules: { type: string, minLength: 1, pattern: '.*\S.*' }
      dependency_allowlist: { $ref: "#/$defs/dependency_allowlist" }
      forbidden_rediscovery: { $ref: "#/$defs/strings", minItems: 1 }
      broker_id: { $ref: "#/$defs/identifier" }
      isolation: { const: fresh }
      budget: { $ref: "#/$defs/budget" }
  adjudication_launch:
    type: object
    additionalProperties: false
    required: [contract_version, kind, review_id, packet_digest, review_revision, finding, stage_1_verdict, spec_intent_projection, cited_region, evidence_surface_rules, dependency_allowlist, forbidden_rediscovery, broker_id, isolation, budget]
    properties:
      contract_version: { const: "2.0" }
      kind: { const: adjudication_launch }
      review_id: { $ref: "#/$defs/identifier" }
      packet_digest: { $ref: "#/$defs/digest" }
      review_revision: { $ref: "#/$defs/review_revision" }
      finding: { $ref: "#/$defs/review_finding" }
      stage_1_verdict: { $ref: "#/$defs/finding_verdict" }
      spec_intent_projection: { $ref: "#/$defs/spec_intent_projection" }
      cited_region: { $ref: "#/$defs/cited_region" }
      evidence_surface_rules: { type: string, minLength: 1, pattern: '.*\S.*' }
      dependency_allowlist: { $ref: "#/$defs/dependency_allowlist" }
      forbidden_rediscovery: { $ref: "#/$defs/strings", minItems: 1 }
      broker_id: { $ref: "#/$defs/identifier" }
      isolation: { const: fresh }
      budget: { $ref: "#/$defs/budget" }
  finding_verdict:
    type: object
    additionalProperties: false
    required: [contract_version, kind, stage, finding_ref, claim_verdict, recorded_at]
    properties:
      contract_version: { const: "2.0" }
      kind: { const: finding_verdict }
      stage: { enum: [verification, adjudication] }
      finding_ref: { $ref: "#/$defs/identifier" }
      claim_verdict: { enum: [confirmed, refuted, unresolved] }
      scope_disposition:
        enum: [in_scope, out_of_scope_preexisting, spec_deviation, spec_accepted_tradeoff]
      citations:
        type: array
        items: { $ref: "#/$defs/finding_citation" }
      severity_adjustment: { $ref: "#/$defs/severity_adjustment" }
      recorded_at: { type: string, format: date-time }
    allOf:
      - if:
          properties:
            claim_verdict: { const: refuted }
          required: [claim_verdict]
        then:
          required: [citations]
          properties:
            citations: { minItems: 1 }
      - if:
          properties:
            severity_adjustment:
              type: object
              required: [direction]
              properties:
                direction: { const: lower }
          required: [severity_adjustment]
        then:
          required: [citations]
          properties:
            citations: { minItems: 1 }
      - if:
          properties:
            scope_disposition: { const: out_of_scope_preexisting }
          required: [scope_disposition]
        then:
          required: [citations]
          properties:
            citations: { minItems: 1 }
      - if:
          properties:
            stage: { const: verification }
          required: [stage]
        then:
          properties:
            scope_disposition: false
  budget:
    type: object
    additionalProperties: false
    required: [max_parent_packet_bytes, max_lane_launch_bytes, max_lane_evidence_bytes, max_evidence_result_bytes, max_lane_result_bytes, max_assignment_expansions, max_specialist_tool_calls, max_specialist_model_turns, max_routing_analysis_pairs, max_routing_analysis_bytes, provider_token_thresholds]
    properties:
      max_parent_packet_bytes: { type: integer, minimum: 1 }
      max_lane_launch_bytes: { type: integer, minimum: 1 }
      max_lane_evidence_bytes: { type: integer, minimum: 1 }
      max_evidence_result_bytes: { type: integer, minimum: 1 }
      max_lane_result_bytes: { type: integer, minimum: 1 }
      max_assignment_expansions: { type: integer, minimum: 0 }
      max_specialist_tool_calls: { type: integer, minimum: 1 }
      max_specialist_model_turns: { type: integer, minimum: 1 }
      max_routing_analysis_pairs: { type: integer, minimum: 1 }
      max_routing_analysis_bytes: { type: integer, minimum: 1 }
      provider_token_thresholds: { $ref: "#/$defs/provider_token_thresholds" }
  provider_token_thresholds:
    type: object
    additionalProperties: false
    required: [input_tokens, cached_input_tokens, output_tokens, reasoning_tokens, total_tokens]
    properties:
      input_tokens: { type: integer, minimum: 1 }
      cached_input_tokens: { type: integer, minimum: 1 }
      output_tokens: { type: integer, minimum: 1 }
      reasoning_tokens: { type: integer, minimum: 1 }
      total_tokens: { type: integer, minimum: 1 }
  budget_outcome:
    type: object
    additionalProperties: false
    required: [contract_version, kind, review_id, packet_digest, assignment_digest, lane, terminal_outcome, budget_kind, configured_limit, observed_value, enforceable]
    properties:
      contract_version: { const: "2.0" }
      kind: { const: budget_outcome }
      review_id: { $ref: "#/$defs/identifier" }
      packet_digest: { $ref: "#/$defs/digest" }
      assignment_digest: { $ref: "#/$defs/digest" }
      lane: { $ref: "#/$defs/identifier" }
      terminal_outcome: { enum: [review_context_budget_exceeded, budget_regression] }
      budget_kind: { $ref: "#/$defs/identifier" }
      configured_limit: { type: integer, minimum: 0 }
      observed_value: { type: integer, minimum: 0 }
      enforceable: { type: boolean }
  usage:
    type: object
    additionalProperties: false
    minProperties: 0
    properties:
      input_tokens: { type: integer, minimum: 0 }
      cached_input_tokens: { type: integer, minimum: 0 }
      output_tokens: { type: integer, minimum: 0 }
      reasoning_tokens: { type: integer, minimum: 0 }
      total_tokens: { type: integer, minimum: 0 }
      fresh_token_approximation: { type: integer, minimum: 0 }
      ownership: { enum: [direct, inclusive] }
  accounting_summary:
    type: object
    additionalProperties: false
    required: [contract_version, kind, review_id, packet_digest, parent, lanes, commit_routing_accounting, parent_analysis_consumption, integration, aggregate_counters, aggregate_direct_usage, aggregate_inclusive_usage, budget_regression]
    properties:
      contract_version: { const: "2.0" }
      kind: { const: accounting_summary }
      review_id: { $ref: "#/$defs/identifier" }
      packet_digest: { $ref: "#/$defs/digest" }
      parent:
        $ref: "#/$defs/accounting_node"
      lanes:
        type: array
        items:
          $ref: "#/$defs/accounting_node"
      commit_routing_accounting: { $ref: "#/$defs/commit_routing_accounting" }
      parent_analysis_consumption: { $ref: "#/$defs/parent_analysis_consumption" }
      # Null when no commit sequence existed to integrate over; the terminal state then names why.
      integration:
        oneOf:
          - { type: "null" }
          - { $ref: "#/$defs/integration_accounting" }
      aggregate_counters: { $ref: "#/$defs/accounting_counters" }
      aggregate_direct_usage: { $ref: "#/$defs/usage" }
      aggregate_inclusive_usage: { $ref: "#/$defs/usage" }
      budget_regression: { type: boolean }
  # Commit-sequence identity plus the routing shape the parent decided before any worker launched.
  commit_routing_accounting:
    type: object
    additionalProperties: false
    required: [commit_sequence_digest, routing_digest, commit_count, lane_count, focused_commit_count, skipped_commit_count, focused_pair_count, skipped_pair_count, incomplete_lanes]
    properties:
      commit_sequence_digest: { $ref: "#/$defs/commit_sequence_digest" }
      routing_digest: { $ref: "#/$defs/digest" }
      commit_count: { type: integer, minimum: 1 }
      lane_count: { type: integer, minimum: 0 }
      # A commit is focused when at least one lane focused it, and skipped only when every lane
      # skipped it; the pair counts keep the per-lane assignment shape separately visible.
      focused_commit_count: { type: integer, minimum: 0 }
      skipped_commit_count: { type: integer, minimum: 0 }
      focused_pair_count: { type: integer, minimum: 0 }
      skipped_pair_count: { type: integer, minimum: 0 }
      incomplete_lanes:
        type: array
        items: { $ref: "#/$defs/identifier" }
  # What the parent's own relevance analysis actually consumed against its configured ceilings, so
  # a routing pass that nearly exhausted its budget is visible before it starts failing loudly.
  parent_analysis_consumption:
    type: object
    additionalProperties: false
    required: [analyzed_pairs, analyzed_bytes, max_analysis_pairs, max_analysis_bytes]
    properties:
      analyzed_pairs: { type: integer, minimum: 0 }
      analyzed_bytes: { type: integer, minimum: 0 }
      max_analysis_pairs: { type: integer, minimum: 1 }
      max_analysis_bytes: { type: integer, minimum: 1 }
  # Terminal state of the single integration pass, attributed to the commit sequence it covered.
  integration_accounting:
    type: object
    additionalProperties: false
    required: [commit_sequence_digest, terminal_outcome, summarized_lane_count, finding_count, counters, usage]
    properties:
      commit_sequence_digest: { $ref: "#/$defs/commit_sequence_digest" }
      terminal_outcome:
        enum: [completed, skipped_not_applicable, review_context_budget_exceeded, failed, timeout, interrupted, spawn_failure, process_failure, unsupported_provider, no_op_resume]
      skip_reason: { type: [string, "null"] }
      summarized_lane_count: { type: integer, minimum: 0 }
      finding_count: { type: integer, minimum: 0 }
      counters: { $ref: "#/$defs/accounting_counters" }
      usage: { $ref: "#/$defs/usage" }
    allOf:
      - if:
          properties:
            terminal_outcome: { const: skipped_not_applicable }
          required: [terminal_outcome]
        then:
          required: [skip_reason]
          properties:
            skip_reason: { type: string, minLength: 1, pattern: '.*\S.*' }
  accounting_counters:
    type: object
    additionalProperties: false
    required: [launch_bytes, evidence_bytes, result_bytes, expansions, tool_calls, model_turns]
    properties:
      launch_bytes: { type: integer, minimum: 0 }
      evidence_bytes: { type: integer, minimum: 0 }
      result_bytes: { type: integer, minimum: 0 }
      expansions: { type: integer, minimum: 0 }
      tool_calls: { type: integer, minimum: 0 }
      model_turns: { type: integer, minimum: 0 }
  accounting_node:
    type: object
    additionalProperties: false
    required: [lane, assignment_digest, launch_bytes, evidence_bytes, result_bytes, expansions, tool_calls, model_turns, inclusive_counters, provider_usage, direct_usage, inclusive_usage, terminal_outcome]
    properties:
      lane: { $ref: "#/$defs/identifier" }
      assignment_digest: { $ref: "#/$defs/digest" }
      launch_bytes: { type: integer, minimum: 0 }
      evidence_bytes: { type: integer, minimum: 0 }
      result_bytes: { type: integer, minimum: 0 }
      expansions: { type: integer, minimum: 0 }
      tool_calls: { type: integer, minimum: 0 }
      model_turns: { type: integer, minimum: 0 }
      inclusive_counters: { $ref: "#/$defs/accounting_counters" }
      provider_usage:
        allOf:
          - { $ref: "#/$defs/usage" }
          - type: object
            properties:
              ownership: { enum: [direct, inclusive] }
      direct_usage: { $ref: "#/$defs/usage" }
      inclusive_usage: { $ref: "#/$defs/usage" }
      terminal_outcome:
        enum: [completed, incomplete, review_context_budget_exceeded, budget_regression, failed, timeout, interrupted, spawn_failure, process_failure, unsupported_provider, forbidden_operation, partial_failure, no_op_resume]
      bundle_composition_digest: { $ref: "#/$defs/digest" }
      segment_accounting:
        type: array
        items: { $ref: "#/$defs/accounting_segment" }
      unreviewed_segment_ids:
        type: array
        items: { $ref: "#/$defs/identifier" }
  accounting_segment:
    type: object
    additionalProperties: false
    required: [segment_id, measured_bytes, entry_count, composition_digest]
    properties:
      segment_id: { $ref: "#/$defs/identifier" }
      measured_bytes: { type: integer, minimum: 0 }
      entry_count: { type: integer, minimum: 0 }
      composition_digest: { $ref: "#/$defs/digest" }
x-coherence-checks:
  - Digests are SHA-256 over canonical UTF-8 serialization with digest fields omitted.
  - Assignment revisions and lane identity equal their parent packet values.
  - Assignment paths and hunks are owned by the parent packet and remain unique.
  - Observed budget values exceed their configured limit for exceeded outcomes.
  - Durable projections omit prompts, diffs, source, project guidance, and tool-output bodies.
  - Parent-packet lane_decisions cover exactly the selected_lanes set, one decision per lane.
  - Every included lane decision carries a non-blank reason, and excluded lanes produce no assignment.
  - Every assigned hunk_id and assigned path is owned by the parent packet.
  - Dependency-allowlist entries are parent-packet-owned and disjoint from assigned_paths.
  - Assignment and launch review_revision equal the parent-packet review_revision.
  - Matched-rule excerpts stay within their bound and carry a digest over the referenced rule body.
  - Expansion records reference an assignment_digest that exists in the current review.
  - Expansion records are excluded from the digest inputs of the assignment and packet they reference, so recording an expansion leaves assignment_digest and packet_digest unchanged.
  - An assignment records no more expansions than max_assignment_expansions allows.
  - A budget_regression terminal_outcome is reported only for a non-enforceable provider dimension observed after the worker exited, and is never enforceable.
  - Specialist tool calls and model turns are measured at the broker seam and terminate the lane with review_context_budget_exceeded once their budget is passed.
  - Every inclusive usage value equals the node's direct usage plus each child node's direct usage exactly once.
  - Aggregate direct usage sums direct ownership only; aggregate inclusive usage is the parent root and nested sessions are never added twice.
  - Hunk ids are content-addressed over path, spans, and normalized content, not positional.
  - Parent-packet, assignment, and launch envelopes never accept inlined hunk bodies; changed_hunks and launch bundle entries are index-only.
  - Commit units partition the parent packet's changed_hunks exactly once, with contiguous order indices from zero.
  - A commit_range sequence chains parent to child from base_revision to head_revision; a synthetic source is the sole unit of its packet and never carries a fabricated commit SHA.
  - The coverage fact reports a checked chain-and-ownership property over the authoritative base-to-head delta, never textual equality of concatenated incremental diffs.
  - A lane bundle covers exactly its assignment's assigned_hunks, names only packet-owned commits, preserves packet commit order, and contributes to assignment_digest.
  - Launch payloads project only the assigned commit units and the assembled bundle object; no aggregate or complete-diff artifact reaches a worker.
  - A launch bundle's lane_disposition is complete only when every assigned segment is reviewable within budget; incomplete lanes name unreviewed segments and the stopping budget dimension.
  - The routing matrix carries exactly one final disposition — focused or skipped — for every analyzed commit/lane pair, with no deferred candidate state, since no worker re-decides relevance downstream.
  - Every routing decision carries a non-blank bounded reason, and a skip reason names the commit's changed paths and the lane signals that failed to match them, so it is falsifiable against the changed hunks.
  - A required baseline lane is focused for every commit unit and can never be dropped by sparse routing.
  - Selected lanes are exactly the lanes that focused at least one commit and own at least one changed path in those commits.
  - An assignment's assigned_hunks are exactly the hunks its focused commits changed under its owned paths; a hunk belonging to a commit skipped for that lane is never assigned.
  - The routing matrix contributes to packet_digest, and a lane's routing column contributes to its assignment_digest, so flipping a disposition or a skip reason is digest-visible.
  - Parent-side routing analysis is bounded by max_routing_analysis_pairs and max_routing_analysis_bytes and fails loudly on breach rather than degrading into over-broad or under-broad assignments.
  - The commit_sequence_digest is SHA-256 over the packet's ordered commit_unit_ids, so it names the reviewed sequence independently of routing, and a lane or integration result minted against a different sequence is rejected rather than merged.
  - Exactly one integration pass runs per review, after every selected lane reaches a terminal state, and it never re-launches a specialist rubric; its cost does not scale with commit count.
  - An integration launch carries final-state evidence targets, commit identity metadata, and bounded per-lane summaries only; a raw lane bundle, a sibling lane's hunk bodies, a complete PR diff, or a parent transcript in that payload is a contract breach, not a degraded delivery.
  - A review with no commit sequence to integrate over records the integration pass as skipped_not_applicable with a non-blank reason, never as completed.
  - An incomplete lane is non-clean coverage that names its unreviewed segments; a completed integration pass never compensates for, closes, or offsets that gap in aggregation or reporting.
  - Specialist completion and integration completion are distinct durable boundaries: a resume re-runs only lanes without a durable result, and re-runs the integration pass only when the integration pass itself did not complete.
