$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/feature-task-runtime-persistence-schema.yaml"
title: Feature-task-runtime handoff persistence records
description: Strict wire records keeping private phase evidence separate from exact delivered projections.
oneOf:
  - $ref: "#/$defs/private_evidence"
  - $ref: "#/$defs/delivered_projection"
$defs:
  checkpoint:
    type: object
    additionalProperties: false
    required: [fingerprint]
    properties:
      fingerprint:
        type: string
        minLength: 1
      base_ref:
        type: string
        minLength: 1
      head_ref:
        type: string
        minLength: 1
      working_tree_owned_paths:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
  private_evidence:
    type: object
    additionalProperties: false
    required:
      - contract_version
      - record_kind
      - workflow_id
      - producer_phase_id
      - producer_iteration
      - repository_checkpoint
      - phase_output
    properties:
      contract_version:
        const: "0.2"
      record_kind:
        const: private_phase_evidence
      workflow_id:
        type: string
        minLength: 1
      producer_phase_id:
        type: string
        minLength: 1
      producer_iteration:
        type: integer
        minimum: 1
      repository_checkpoint:
        $ref: "#/$defs/checkpoint"
      phase_output:
        type: string
        minLength: 1
  delivered_projection:
    type: object
    additionalProperties: false
    required:
      - contract_version
      - record_kind
      - workflow_id
      - consumer_phase_id
      - consumer_delivery_iteration
      - source_producer_iterations
      - repository_checkpoint
      - handoff_envelope
    properties:
      contract_version:
        const: "0.2"
      record_kind:
        const: delivered_projection
      workflow_id:
        type: string
        minLength: 1
      consumer_phase_id:
        type: string
        minLength: 1
      consumer_delivery_iteration:
        type: integer
        minimum: 1
      source_producer_iterations:
        type: array
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [phase_id, iteration]
          properties:
            phase_id:
              type: string
              minLength: 1
            iteration:
              type: integer
              minimum: 1
      repository_checkpoint:
        $ref: "#/$defs/checkpoint"
      handoff_envelope:
        type: object
        description: Validated separately against the handoff-envelope schema before typed decoding.
x-coherence-checks:
  - id: exact-delivery
    description: The serialized envelope bytes are the exact validated prompt-visible projection.
  - id: separate-read-apis
    description: Private evidence and delivered projections use distinct models, keys, and read APIs.
  - id: incompatible-legacy-version
    description: Missing record kind, identity, or version is a typed loud failure; no implicit migration occurs.
