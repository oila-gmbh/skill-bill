$schema: https://json-schema.org/draft/2020-12/schema
$id: https://skill-bill.dev/contracts/goal-planning-discovery-exclusions-schema.yaml
title: Goal planning discovery exclusions
description: >-
  Governs goal-planning-discovery-exclusions.yaml, the single deny source shared by filesystem
  planning discovery and shared-context packet migration. Closed to unknown keys: a misspelled or
  invented key must fail loudly rather than read as a deny rule that silently never applies.
type: object
additionalProperties: false
required:
  - contract_version
  - excluded_roots
  - excluded_directory_names
properties:
  contract_version:
    const: "0.3"
  excluded_roots:
    description: Anchored, normalized, repo-relative directory prefixes ending in "/".
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 2
      pattern: "^(?!/)(?!\\./)(?!.*(^|/)\\.\\.(/|$))[^\\\\]+/$"
  excluded_directory_names:
    description: Bare directory names denied at any depth.
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
      pattern: "^(?!\\.{1,2}$)[^/\\\\]+$"
