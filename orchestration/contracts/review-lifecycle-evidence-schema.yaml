$schema: https://json-schema.org/draft/2020-12/schema
$id: https://skill-bill.dev/contracts/review-lifecycle-evidence-schema.yaml
title: Delegated review lifecycle evidence contract
description: Bounded, durable lifecycle evidence for delegated code review.
oneOf:
  - $ref: "#/$defs/evidence_package"
  - $ref: "#/$defs/lifecycle_event"
$defs:
  identifier: { type: string, minLength: 1, maxLength: 200, pattern: '.*\S.*' }
  digest: { type: string, pattern: "^[a-f0-9]{64}$" }
  timestamp: { type: string, minLength: 1, maxLength: 64, pattern: '^[0-9T:.+Z-]+$' }
  bounded_text: { type: string, minLength: 1, maxLength: 500, pattern: '.*\S.*' }
  component: { enum: [coordinator, worker, aggregation, terminal] }
  worker_state:
    enum: [selected, queued, launched, running, completed, failed, timed_out, cancelled, unavailable, invalid_output]
  event_kind:
    enum: [coordinator_prepared, worker_selected, worker_queued, worker_launched, worker_running,
      worker_progress, worker_completed, worker_failed, worker_timed_out, worker_cancelled,
      worker_unavailable, worker_invalid_output, aggregation_started, aggregation_completed,
      aggregation_failed, terminal_completed, terminal_failed, terminal_timed_out,
      terminal_cancelled, coordinator_crashed]
  process_outcome:
    enum: [not_started, zero_exit, non_zero_exit, interrupted, timed_out, unavailable,
      invalid_output, aggregation_failure, missing_result, coordinator_crash]
  observation:
    type: object
    additionalProperties: false
    required: [kind, observed_at, status]
    properties:
      kind: { enum: [process_heartbeat, mcp_heartbeat, process_started, mcp_startup] }
      observed_at: { $ref: "#/$defs/timestamp" }
      status: { $ref: "#/$defs/bounded_text" }
  provider_output:
    type: object
    additionalProperties: false
    required: [observed_at, outcome, byte_size, sha256]
    properties:
      observed_at: { $ref: "#/$defs/timestamp" }
      outcome: { $ref: "#/$defs/bounded_text" }
      byte_size: { type: integer, minimum: 0 }
      sha256: { $ref: "#/$defs/digest" }
  declared_progress:
    type: object
    additionalProperties: false
    required: [observed_at, progress_id, label]
    properties:
      observed_at: { $ref: "#/$defs/timestamp" }
      progress_id: { $ref: "#/$defs/identifier" }
      label: { $ref: "#/$defs/bounded_text" }
  durable_progress:
    type: object
    additionalProperties: false
    required: [observed_at, progress_id, label]
    properties:
      observed_at: { $ref: "#/$defs/timestamp" }
      progress_id: { $ref: "#/$defs/identifier" }
      label: { $ref: "#/$defs/bounded_text" }
  terminal_completion:
    type: object
    additionalProperties: false
    required: [completed_at, status]
    properties:
      completed_at: { $ref: "#/$defs/timestamp" }
      status: { $ref: "#/$defs/process_outcome" }
  diagnostic:
    type: object
    additionalProperties: false
    required: [reference, summary]
    properties:
      reference: { $ref: "#/$defs/identifier" }
      summary: { $ref: "#/$defs/bounded_text" }
  result_finding:
    type: object
    additionalProperties: false
    required: [severity, confidence, location, description]
    properties:
      severity: { enum: [blocker, major, minor, nit] }
      confidence: { enum: [High, Medium, Low] }
      location: { $ref: "#/$defs/bounded_text" }
      description: { $ref: "#/$defs/bounded_text" }
      specialist_skill_name: { $ref: "#/$defs/identifier" }
      origin_layer_chains:
        type: array
        maxItems: 8
        items:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/$defs/identifier" }
      repository_path: { $ref: "#/$defs/identifier" }
      line: { type: integer, minimum: 1 }
  result_envelope:
    type: object
    additionalProperties: false
    required: [findings]
    properties:
      findings:
        type: array
        maxItems: 7
        items: { $ref: "#/$defs/result_finding" }
  lifecycle_event:
    type: object
    additionalProperties: false
    required: [contract_version, kind, event_id, review_id, sequence, occurred_at, component, event_kind, packet_digest]
    properties:
      contract_version: { const: "0.2" }
      kind: { const: lifecycle_event }
      event_id: { $ref: "#/$defs/identifier" }
      review_id: { $ref: "#/$defs/identifier" }
      sequence: { type: integer, minimum: 1 }
      occurred_at: { $ref: "#/$defs/timestamp" }
      component: { $ref: "#/$defs/component" }
      event_kind: { $ref: "#/$defs/event_kind" }
      state: { $ref: "#/$defs/worker_state" }
      worker_id: { $ref: "#/$defs/identifier" }
      provider_id: { $ref: "#/$defs/identifier" }
      attempt: { type: integer, minimum: 1 }
      assignment_digest: { $ref: "#/$defs/digest" }
      packet_digest: { $ref: "#/$defs/digest" }
      routed_area: { $ref: "#/$defs/identifier" }
      wave_number: { type: integer, minimum: 1 }
      process_outcome: { $ref: "#/$defs/process_outcome" }
      liveness_observations:
        type: array
        maxItems: 8
        items: { $ref: "#/$defs/observation" }
      provider_output: { $ref: "#/$defs/provider_output" }
      declared_progress: { $ref: "#/$defs/declared_progress" }
      durable_progress: { $ref: "#/$defs/durable_progress" }
      result_envelope: { $ref: "#/$defs/result_envelope" }
      terminal_completion: { $ref: "#/$defs/terminal_completion" }
      diagnostic: { $ref: "#/$defs/diagnostic" }
    allOf:
      - if:
          properties:
            event_kind: { const: worker_progress }
          required: [event_kind]
        then:
          required: [durable_progress]
      - if:
          properties:
            event_kind: { const: worker_completed }
          required: [event_kind]
        then:
          required: [result_envelope]
      - if:
          properties:
            event_kind: { const: aggregation_completed }
          required: [event_kind]
        then:
          required: [terminal_completion]
      - if:
          properties:
            event_kind: { const: terminal_completed }
          required: [event_kind]
        then:
          required: [terminal_completion]
  evidence_package:
    type: object
    additionalProperties: false
    required: [contract_version, kind, review_id, packet_digest, events]
    properties:
      contract_version: { const: "0.2" }
      kind: { const: review_lifecycle_evidence }
      review_id: { $ref: "#/$defs/identifier" }
      packet_digest: { $ref: "#/$defs/digest" }
      events:
        type: array
        items: { $ref: "#/$defs/lifecycle_event" }
