$schema: https://json-schema.org/draft/2020-12/schema
$id: https://skill-bill.dev/contracts/goal-verification-boundary-caps-schema.yaml
title: Goal verification boundary caps
description: >-
  Governs goal-verification-boundary-caps.yaml, the single cap source for finding verification
  boundary discovery and body resolution. Each cap is tighter than its planning counterpart except
  max_boundary_file_bytes, which is shared with planning so discovery and resolution parse identical
  file text.
type: object
additionalProperties: false
required:
  - contract_version
  - max_discovery_file_count
  - max_headings_per_file
  - max_catalog_headings
  - history_recency_days
  - max_selected_bodies
  - max_body_bytes
  - max_total_body_bytes
  - max_boundary_file_bytes
properties:
  contract_version:
    const: "0.2"
  max_discovery_file_count:
    type: integer
    minimum: 1
  max_headings_per_file:
    type: integer
    minimum: 1
  max_catalog_headings:
    type: integer
    minimum: 1
  history_recency_days:
    type: integer
    minimum: 1
  max_selected_bodies:
    type: integer
    minimum: 1
  max_body_bytes:
    type: integer
    minimum: 1
  max_total_body_bytes:
    type: integer
    minimum: 1
  max_boundary_file_bytes:
    type: integer
    minimum: 1
