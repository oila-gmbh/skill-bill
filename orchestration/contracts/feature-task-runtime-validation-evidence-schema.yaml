$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/feature-task-runtime-validation-evidence-schema.yaml"
title: Feature-task-runtime validation evidence
type: object
additionalProperties: false
required: [contract_version, results]
properties:
  contract_version:
    const: "0.1"
  results:
    type: array
    minItems: 1
    maxItems: 50
    items:
      type: object
      additionalProperties: false
      required: [command, exit_code]
      properties:
        command:
          type: string
          minLength: 1
        exit_code:
          type: integer
