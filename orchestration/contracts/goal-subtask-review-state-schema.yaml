$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/goal-subtask-review-state-schema.yaml"
title: "Goal subtask review state"
description: >
  Durable, child-owned review state for one decomposed feature-task runtime
  subtask. It pins the local review baseline, selected execution mode, pass
  accounting, compact safe summaries, per-Blocker disposition evidence, and the
  references to full review input and result artifacts.
type: object
additionalProperties: false
required:
  - contract_version
  - review_base_sha
  - baseline_untracked_paths
  - code_review_mode
  - completed_pass_count
  - disposition
  - pass_results
  - emitted_pass_count
properties:
  contract_version:
    type: string
    const: "0.8"
  review_base_sha:
    type: string
    pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
  baseline_untracked_paths:
    type: array
    items:
      type: string
      minLength: 1
    uniqueItems: true
  code_review_mode:
    description: >
      Immutable selected mode for the initial review pass. `delegated` is the specialist
      subagent fan-out, `inline` is the single-prompt review in the child's own context, and
      `auto` resolves to delegated for pass one. Every remediation pass from two onward always
      executes inline.
    type: string
    enum: [auto, inline, delegated]
  reserved_pass_number:
    type: integer
    minimum: 1
  completed_pass_count:
    type: integer
    minimum: 0
  disposition:
    type: string
    enum: [pending, paused, review_cap_reached]
  blocker_dispositions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [finding_id, verdict, evidence]
      properties:
        finding_id:
          type: string
          minLength: 1
        verdict:
          type: string
          enum: [resolved, unresolved]
        evidence:
          type: array
          items:
            type: string
            minLength: 1
  operator_decision:
    type: string
    enum: [retry_fix, accept_and_advance, abandon_subtask]
  operator_retry_rounds:
    description: >
      Count of operator-granted retry_fix rounds consumed inside the already-reserved pass. A
      non-zero value means a granted remediation is in flight, so the carried-forward settlement
      must re-run the review rather than replay the stale pass result the operator just overrode.
      Reset to zero when the re-entered pass settles. Never re-reserves a consumed pass.
    type: integer
    minimum: 0
  resolved_tier:
    description: Concrete mode the pass executed; `auto` is a request, never a resolution.
    type: string
    enum: [inline, delegated]
  deciding_rule:
    type: string
    minLength: 1
  remediation_base_sha:
    description: >
      Pre-fix tree sha recorded at the implement_fix entry checkpoint. Each remediation pass
      reviews diff(this sha -> current HEAD) rather than the immutable base-to-current delta, so a
      defect the remediation itself introduced is materialized in the pass input. Absent until the
      first implement_fix re-entry; review_base_sha remains the sole authority for pass one.
    type: string
    pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
  review_input_artifact:
    type: string
    minLength: 1
  reviewed_delta_digest:
    description: >
      Digest of the exact base-to-current delta the latest review pass judged. A capped
      disposition is authoritative only while this digest still matches the working tree.
    type: string
    pattern: "^[0-9a-f]{64}$"
  repair_receipts:
    description: >
      Ordered implement_fix repair receipts keyed by remediation round number. Additive and
      omitted when empty so records written before this key still decode. Re-entering the
      same round replaces that round's entry in place rather than appending.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [contract_version, round_number, pre_fix_checkpoint_sha, entries]
      properties:
        contract_version:
          type: string
          const: "0.1"
        round_number:
          type: integer
          minimum: 1
        pre_fix_checkpoint_sha:
          type: string
          pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
        entries:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [severity, label, text, outcome, constructs, intent]
            properties:
              severity:
                type: string
                enum: [blocker, major, minor, nit]
              label:
                type: string
                minLength: 1
                maxLength: 256
              text:
                type: string
                minLength: 1
                maxLength: 256
              finding_id:
                type: string
                minLength: 1
                maxLength: 256
              outcome:
                type: string
                enum: [addressed, no_edit_required]
              constructs:
                type: array
                maxItems: 16
                items:
                  type: object
                  additionalProperties: false
                  required: [symbol]
                  properties:
                    symbol:
                      type: string
                      minLength: 1
                      maxLength: 256
                      pattern: "^[A-Za-z_][A-Za-z0-9_$-]*(?:\\.[A-Za-z_][A-Za-z0-9_$-]*)?$"
                    file:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: "^[A-Za-z0-9_.-]+$"
              intent:
                type: string
                minLength: 1
                maxLength: 256
              no_edit_reason:
                type: string
                minLength: 1
                maxLength: 256
  pass_results:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - pass_number
        - verdict
        - review_result_artifact
        - unresolved_finding_count
        - findings
        - review_run_id
      properties:
        pass_number:
          type: integer
          minimum: 1
        verdict:
          type: string
          enum: [approved, changes_requested, review_cap_reached]
        executed_mode:
          type: string
          enum: [inline, delegated]
        review_run_id:
          type: string
          minLength: 1
        commit_focused_accounting:
          description: >
            What a delegated commit-focused pass actually did: which commit sequence it covered, how
            sparsely it routed, which lanes ended incomplete (budget exhaustion or a failed lane run), what the
            parent's own relevance analysis consumed, and how the single integration pass ended.
            Absent for an inline or non-commit pass, which has no commit sequence to describe.
            Identities, counts, and lane names only — never a commit subject, path, or diff text.
          type: object
          additionalProperties: false
          required: [commit_sequence_digest, commit_count, lane_count, focused_commit_count, skipped_commit_count, integration_terminal_outcome]
          properties:
            commit_sequence_digest:
              type: string
              pattern: "^[0-9a-f]{64}$"
            routing_digest:
              type: string
              pattern: "^[0-9a-f]{64}$"
            commit_count:
              type: integer
              minimum: 0
            lane_count:
              type: integer
              minimum: 0
            focused_commit_count:
              type: integer
              minimum: 0
            skipped_commit_count:
              type: integer
              minimum: 0
            focused_pair_count:
              type: integer
              minimum: 0
            skipped_pair_count:
              type: integer
              minimum: 0
            lane_bundle_sizes:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
            lane_segment_counts:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
            incomplete_lanes:
              type: array
              uniqueItems: true
              items:
                type: string
                minLength: 1
            parent_analysis_pairs:
              type: integer
              minimum: 0
            parent_analysis_bytes:
              type: integer
              minimum: 0
            integration_terminal_outcome:
              type: string
              enum:
                - completed
                - skipped_not_applicable
                - review_context_budget_exceeded
                - failed
                - timeout
                - interrupted
                - spawn_failure
                - process_failure
                - unsupported_provider
                - no_op_resume
            integration_skip_reason:
              type: string
              minLength: 1
            integration_finding_count:
              type: integer
              minimum: 0
        review_result_artifact:
          type: string
          minLength: 1
        unresolved_finding_count:
          type: integer
          minimum: 0
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [severity, label, text]
            properties:
              finding_id:
                description: >
                  The id the review output carried for this finding (the F-XXX register id). The
                  reserved remediation pass dispositions against these ids, so the disposition-to-
                  finding correspondence that terminates the loop is verifiable at the parse seam.
                type: string
                minLength: 1
              severity:
                type: string
                enum: [blocker, major, minor, nit]
              label:
                type: string
                minLength: 1
              text:
                type: string
                minLength: 1
  emitted_pass_count:
    type: integer
    minimum: 0
x-coherence-checks:
  - review_base_sha and baseline_untracked_paths are immutable after initial child creation.
  - reserved_pass_number is completed_pass_count + 1 for any positive pass number and prevents a crash/resume from resetting accounting or allocating a second pass.
  - pass_results is ordered by pass_number and has exactly completed_pass_count entries.
  - When present, pass one executed_mode is the resolution of code_review_mode (auto resolves to delegated) and every pass from two onward is inline.
  - pass_number, reserved_pass_number, completed_pass_count, and emitted_pass_count are unbounded above: the Blocker disposition, not a pass ceiling, terminates the remediation loop.
  - review_cap_reached is never minted by pass accounting; it survives only as a decodable legacy disposition and requires unresolved Blocker findings on the last completed pass.
  - emitted_pass_count is an acknowledgement watermark for compact parent-goal summaries.
  - commit_focused_accounting is present exactly for a delegated pass over a real commit sequence; an inline or non-commit pass omits it rather than fabricating a sequence identity.
  - focused_commit_count and skipped_commit_count sum to commit_count, and a lane named in incomplete_lanes is non-clean coverage that the integration pass never compensates for.
  - integration_terminal_outcome records the integration pass's own boundary, distinct from every lane disposition, so a resume can tell "lanes done, integration pending" from "everything done".
  - reviewed_delta_digest records what the latest pass judged; a review_cap_reached disposition whose digest no longer matches the current delta is stale and the child reopens a fresh review generation rather than replaying it.
  - repair_receipts is additive and omitted when empty so records written before the key still decode; upsert is keyed by round_number so a crash-resume cannot append a duplicate.
