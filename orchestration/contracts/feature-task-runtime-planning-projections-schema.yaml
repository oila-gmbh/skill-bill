# Feature-task-runtime planning-projections schema (canonical source of truth).
#
# Quarantined at contract version 0.3: no live planning projection variants remain. Implement prose
# lives in feature-task-runtime-phase-output-schema.yaml and is delivered through
# feature_task_runtime.phase_prose handoff projections, not through this schema.
#
# Legacy implementation_receipt payloads fail this reject-all root; the runtime quarantines and
# regenerates in-band rather than dual-reading old receipts.
#
# Versioning rule:
#
# - contract_version is pinned by FEATURE_TASK_RUNTIME_PLANNING_PROJECTIONS_CONTRACT_VERSION in
#   runtime-kotlin/runtime-contracts/src/main/kotlin/skillbill/contracts/workflow/FeatureTaskRuntimeSchemaPaths.kt.
# - The parity test FeatureTaskRuntimePlanningProjectionsSchemaContractVersionTest fails the build
#   if this file and that constant diverge.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://skill-bill.dev/contracts/feature-task-runtime-planning-projections-schema.yaml"
title: "Feature-task-runtime planning projections"
description: "Quarantined reject-all schema; no live bounded planning projection variants."
type: object
oneOf: []

x-coherence-checks:
  - id: contract-version-parity
    description: >-
      contract_version.const equals FEATURE_TASK_RUNTIME_PLANNING_PROJECTIONS_CONTRACT_VERSION,
      pinned by FeatureTaskRuntimePlanningProjectionsSchemaContractVersionTest.

$defs:
  contractVersion:
    type: string
    const: "0.3"
