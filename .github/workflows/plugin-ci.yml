name: Plugin CI

on:
  pull_request:
    paths:
      - "intellij-plugin/**"
      - ".github/workflows/plugin-ci.yml"
  push:
    branches: [main]
    paths:
      - "intellij-plugin/**"
      - ".github/workflows/plugin-ci.yml"
  # verifyPlugin downloads two full IDEs, so it runs nightly off-peak instead of
  # on every push. Schedule events ignore the path filters above by design.
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hosted ubuntu only: unlike validate-agent-configs.yml, nothing here may reach
  # the self-hosted runner, for any event.
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run plugin checks
        run: (cd intellij-plugin && ./gradlew clean check --no-build-cache)

  verify:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # No failureLevel override: the build script owns it.
      - name: Run plugin verifier
        run: (cd intellij-plugin && ./gradlew verifyPlugin)
