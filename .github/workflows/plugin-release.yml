name: Plugin Release

# Plugin tag stream only. Runtime tags (v*) are release.yml's and never build the plugin.
on:
  push:
    tags:
      - "plugin-v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Hosted ubuntu only: nothing here may reach the self-hosted runner.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Derive plugin version from tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#plugin-v}"
          if [[ "${version}" == "${tag}" ]]; then
            echo "Tag ${tag} is not on the plugin-vX.Y.Z tag stream." >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${tag} does not carry a plain semver version (expected plugin-vX.Y.Z)." >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      # gradle.properties keeps its -SNAPSHOT version for local development; the
      # released version flows only through this command-line property.
      - name: Build and verify plugin
        shell: bash
        run: (cd intellij-plugin && ./gradlew check verifyPlugin buildPlugin "-Pversion=${VERSION}")

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          dist="intellij-plugin/build/distributions"
          zips=()
          while IFS= read -r found; do
            zips+=("${found}")
          done < <(find "${dist}" -maxdepth 1 -type f -name '*.zip' | sort)
          if [[ "${#zips[@]}" -ne 1 ]]; then
            echo "Expected exactly one plugin archive in ${dist}, found ${#zips[@]}." >&2
            exit 1
          fi
          rm -rf dist
          mkdir -p dist
          cp "${zips[0]}" "dist/skill-bill-intellij-plugin-${VERSION}.zip"
          (cd dist && sha256sum "skill-bill-intellij-plugin-${VERSION}.zip" > "skill-bill-intellij-plugin-${VERSION}.zip.sha256")

      # Fail closed before any release exists: exactly the zip and its sidecar.
      - name: Check staged assets
        shell: bash
        run: |
          set -euo pipefail
          asset_names=(
            "skill-bill-intellij-plugin-${VERSION}.zip"
            "skill-bill-intellij-plugin-${VERSION}.zip.sha256"
          )
          for asset_name in "${asset_names[@]}"; do
            [[ -f "dist/${asset_name}" ]] || { echo "Missing expected release asset: ${asset_name}." >&2; exit 1; }
          done
          for staged_asset in dist/*; do
            [[ -f "${staged_asset}" ]] || continue
            staged_name="$(basename "${staged_asset}")"
            expected=false
            for asset_name in "${asset_names[@]}"; do
              if [[ "${staged_name}" == "${asset_name}" ]]; then
                expected=true
                break
              fi
            done
            if [[ "${expected}" != "true" ]]; then
              echo "Unexpected release asset: ${staged_name}." >&2
              exit 1
            fi
          done

      - name: Create plugin release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            "dist/skill-bill-intellij-plugin-${VERSION}.zip" \
            "dist/skill-bill-intellij-plugin-${VERSION}.zip.sha256"
