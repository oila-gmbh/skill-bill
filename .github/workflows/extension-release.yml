name: Extension Release

# Extension tag stream only. Runtime tags (v*) and plugin tags (plugin-v*) never build the extension.
on:
  push:
    tags:
      - "extension-v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Derive extension version from tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#extension-v}"
          if [[ "${version}" == "${tag}" ]]; then
            echo "Tag ${tag} is not on the extension-vX.Y.Z tag stream." >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${tag} does not carry a plain semver version (expected extension-vX.Y.Z)." >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Build and verify extension
        shell: bash
        run: |
          set -euo pipefail
          cd vscode-extension
          npm ci
          npm test
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          npm run package

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          dist="vscode-extension/dist"
          vsix_files=()
          while IFS= read -r found; do
            vsix_files+=("${found}")
          done < <(find vscode-extension -maxdepth 1 -type f -name '*.vsix' | sort)
          if [[ "${#vsix_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one VSIX in vscode-extension/, found ${#vsix_files[@]}." >&2
            exit 1
          fi
          rm -rf "${dist}"
          mkdir -p "${dist}"
          cp "${vsix_files[0]}" "${dist}/skill-bill-vscode-extension-${VERSION}.vsix"
          (cd "${dist}" && sha256sum "skill-bill-vscode-extension-${VERSION}.vsix" > "skill-bill-vscode-extension-${VERSION}.vsix.sha256")

      - name: Check staged assets
        shell: bash
        run: |
          set -euo pipefail
          cd vscode-extension
          npm run validate-staged-release -- "${VERSION}"

      - name: Create extension release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            "vscode-extension/dist/skill-bill-vscode-extension-${VERSION}.vsix" \
            "vscode-extension/dist/skill-bill-vscode-extension-${VERSION}.vsix.sha256"
