[versions]
beryxRuntime = "2.0.1"
detekt = "1.23.8"
jna = "5.13.0"
clikt = "5.1.0"
kotlin = "2.4.0-Beta2"
kotlinInject = "0.9.0"
ksp = "2.3.7"
kotlinx-serialization = "1.7.3"
jackson = "2.18.2"
jsonSchemaValidator = "1.5.6"
junit = "5.11.3"
snakeyaml = "2.3"
sqlite-jdbc = "3.53.0.0"
slf4j = "2.0.17"
spotless = "6.25.0"

[libraries]
beryx-runtime-gradle-plugin = { module = "org.beryx:badass-runtime-plugin", version.ref = "beryxRuntime" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin.jvm:org.jetbrains.kotlin.jvm.gradle.plugin", version.ref = "kotlin" }
kotlin-inject-compiler = { module = "me.tatarka.inject:kotlin-inject-compiler-ksp", version.ref = "kotlinInject" }
kotlin-inject-runtime = { module = "me.tatarka.inject:kotlin-inject-runtime", version.ref = "kotlinInject" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
beryx-runtime = { id = "org.beryx.runtime", version.ref = "beryxRuntime" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
